saturday1:
  - title: "Plenary talk by Stephen Boyd"
    time: 9:00-9:30
    image: boyd.png
    text:  <b class='title-random'>🏅 TBD </b><p class='break-random'> <br> Samsung Professor in the School of Engineering and Professor of Electrical Engineering at Stanford, where he chairs the EE department. His work is on convex optimization and its applications in control, signal processing, machine learning, and finance. Few researchers have done more to close the gap between a published mathematical result and software that anyone can actually run, and Dr. Boyd is one of them. </p>
  - title: "Plenary talk by Vanja Josifovski"
    time:  9:30-10:00
    place: ""
    image: organization/vanja.png
    text:  <b class='title-random'>🏅 TBD</b><p class='break-random'> <br> Builder of large scale systems that reason over structured and relational data. He was a research scientist at IBM and Yahoo Research, then CTO at Pinterest and later CTO of Homes at Airbnb, before co-founding Kumo AI, whose relational foundation models make predictions directly over a database graph rather than a flattened feature table. NVIDIA acquired Kumo in June 2026 and he moved there with it. His career is a long argument that the structure between records is where the signal lives.</p>
  - title: "Plenary talk by Xue (Steve) Liu"
    time: 10:00-10:30
    place: ""
    image: liu.png
    text:  <b class="title-random">🏅 TBD </b><p class="break-random"><br>Associate VP for Research and Professor of Machine Learning and Computer Science at MBZUAI, on leave from McGill University's School of Computer Science. Previously VP R&D and Chief Scientist at Samsung AI Center Montreal, and Chief Scientist at Tinder, with earlier stints at HP Labs and IBM T. J. Watson. IEEE Fellow, Fellow of the Canadian Academy of Engineering, former chair of ACM SIGBED, author of over 400 papers across intelligent computing systems, IoT, cyber physical systems, and sustainable computing.</p>
  - title: "Coffee Break"
    time:  10:30-11:00
    place: ""
    image: evi_cafe.png
    text:  <p class='break-random'><br>Time for a peer-reviewed caffeine intervention. Refuel before the next round of evidence.</p>
  - title: "Evidence team: Agah Karakuzu"
    time: 11:00-11:20
    place: ""
    image: agah_talk.png
    text:  "<b class='title-random'>🤖 Agents of the Woven Literature </b><p class='break-random'><br>Agah Karakuzu serves as the principal engineer and technical lead for Evidence, guiding its architecture and development. His talk will explore its newest advances in response to the accelerating pace of AI: the woven literature.</p>"
  - title: "Invited talk: Matthew Akamatsu"
    time: 11:20-11:40
    place: ""
    image: akamatsu_talk.png
    text:  "<b class='title-random'>🕸️ Discourse Graphs </b><p class='break-random'><br>Matthew Akamatsu is an Assistant Professor of Biology at the University of Washington, where his lab combines mathematical modeling, genome editing of human stem cells, and fluorescence microscopy to study how the actin cytoskeleton produces force. His talk will present discourse graphs, which capture research as a network of questions, claims, and the evidence behind them rather than as isolated papers.</p>"
  - title: "Invited talk: Kiril Gashteovski"
    time: 11:40-12:00
    place: ""
    image: kiril_talk.png
    text:  "<b class='title-random'>⚖️ Peer Review Using AI </b><p class='break-random'><br>Kiril Gashteovski is a Principal Researcher in the Human-Centered AI group at NEC Laboratories Europe, working on natural language processing, knowledge graphs, and explainable AI. His talk will cover what AI reviewers do well and where they fall short, drawing on <a href='https://arxiv.org/abs/2605.20668' target='_blank'>a study</a> in which 45 expert scientists rated human and AI reviews of Nature-family papers.</p>"
  - title: Lunch Round Table Discussion with Sun Zhe, Bas Rokers, Nikola Stikov, and Ordan Chukaliev
    text: <b class='title-random'>⎈ Evidence Chairs </b><p class='break-random'><br>Over lunch, Sun Zhe (Juntendo University), Bas Rokers (NYU Abu Dhabi), Nikola Stikov (Polytechnique Montreal), and Ordan Chukaliev (UKIM Skopje) will lead a round table discussion on key issues related to Evidence’s long-term success and maintainability.</p>
    time: 12:00-13:00
    place: ""
    image: evi_food.png
